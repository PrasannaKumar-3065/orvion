# ═══════════════════════════════════════════════════════════════════════════════
#  Orvion — Cross-Platform Build Pipeline  (API-inference, no ML deps)
#  ───────────────────────────────────────────────────────────────────────────
#  Triggers:
#    • push to main / master
#    • pull request to main / master
#    • manual dispatch (workflow_dispatch)
#    • version tag push  (v*)  → also creates a GitHub Release
#
#  Artifacts produced:
#    Windows  │ OrvionSetup-windows-x64.exe   (Inno Setup installer)
#    Linux    │ Orvion-linux-x86_64.AppImage
#    macOS    │ Orvion-macos-universal.dmg
#
#  What is NOT included:
#    • PyTorch / transformers / unsloth / huggingface_hub — not needed
#    • Any local AI model — inference runs via gradio_client → HuggingFace Space
#
#  Secrets required:
#    HF_TOKEN         HuggingFace API token — REQUIRED for Space inference
#                     Add at: Settings → Secrets and variables → Actions
#
#  Secrets for release signing (all optional — builds succeed without):
#    APPLE_IDENTITY   Developer ID Application: ... string
#    APPLE_TEAM_ID    10-char Apple Team ID
#    APPLE_ID         Apple ID email
#    APPLE_APP_PWD    App-specific password for notarytool
#    WIN_CERT_BASE64  Base64-encoded .pfx certificate for signtool
#    WIN_CERT_PWD     Password for the .pfx certificate
# ═══════════════════════════════════════════════════════════════════════════════

name: Build Orvion Installers

on:
  push:
    branches: [ main, master ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release after build?"
        required: false
        default: "false"
        type: choice
        options: [ "true", "false" ]

# Cancel in-progress runs for the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"       # matches cpython-312 bytecache in repo
  APP_VERSION:    "1.0.0"

# ─────────────────────────────────────────────────────────────────────────────
jobs:

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  WINDOWS BUILD                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
  build-windows:
    name: "Windows — Inno Setup Installer"
    runs-on: windows-latest
    timeout-minutes: 45          # no model download → much faster

    env:
      HAS_WIN_CERT: ${{ secrets.WIN_CERT_BASE64 != '' }}

    steps:
      # ── 1. Source ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ───────────────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ── 3. Dependencies (API-only — no torch / transformers) ───────────────
      - name: Upgrade pip / wheel / setuptools
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Install runtime dependencies
        run: |
          pip install ^
            "PyQt5>=5.15.10" ^
            "PyQtWebEngine>=5.15.7" ^
            "Pillow>=10.0.0" ^
            "psutil>=5.9.0" ^
            "requests>=2.31.0" ^
            "gradio_client>=0.7.0" ^
            "packaging>=23.0" ^
            "python-dotenv>=1.0.0"

      - name: Install PyInstaller
        run: pip install "pyinstaller>=6.0.0"

      # ── 4. Generate placeholder icon if missing ───────────────────────────
      - name: Generate placeholder icon
        shell: python
        run: |
          import pathlib
          icon_path = pathlib.Path("installer/windows/orvion.ico")
          icon_path.parent.mkdir(parents=True, exist_ok=True)
          if not icon_path.exists():
              try:
                  from PIL import Image
                  img = Image.new("RGBA", (256, 256), (108, 78, 230, 255))
                  img.save(icon_path, format="ICO",
                           sizes=[(16,16),(32,32),(48,48),(256,256)])
                  print(f"Generated placeholder icon: {icon_path}")
              except Exception as e:
                  print(f"Could not generate icon ({e}) — writing empty file")
                  icon_path.write_bytes(b"")

      # ── 5. Write .env so the frozen app can read HF_TOKEN via load_dotenv() ─
      - name: Inject HF_TOKEN into .env
        shell: powershell
        run: |
          $token = "${{ secrets.HF_TOKEN }}"
          if ($token -eq "") {
            Write-Warning "HF_TOKEN secret is not set — Space calls may fail at runtime"
          }
          "HF_TOKEN=$token" | Out-File -FilePath .env -Encoding utf8
          Write-Host "Wrote .env (token length: $($token.Length))"

      # ── 6. PyInstaller build ──────────────────────────────────────────────
      - name: Build with PyInstaller
        run: pyinstaller orvion.spec --clean --noconfirm
        env:
          ORVION_VERSION: ${{ env.APP_VERSION }}

      # ── 7. Sign the exe (only when WIN_CERT_BASE64 secret is set) ─────────
      - name: Sign executable (optional)
        if: env.HAS_WIN_CERT == 'true'
        shell: powershell
        run: |
          $cert_bytes = [Convert]::FromBase64String("${{ secrets.WIN_CERT_BASE64 }}")
          $cert_path  = "$env:TEMP\orvion_cert.pfx"
          [IO.File]::WriteAllBytes($cert_path, $cert_bytes)
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
              /f  $cert_path `
              /p  "${{ secrets.WIN_CERT_PWD }}" `
              /tr "http://timestamp.digicert.com" `
              /td sha256 /fd sha256 `
              "dist\Orvion\Orvion.exe"
          Remove-Item $cert_path -Force

      # ── 7. Inno Setup installer ───────────────────────────────────────────
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Download VC++ Runtime for bundling
        shell: powershell
        run: |
          $url  = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $dest = "installer\windows\vc_redist.x64.exe"
          Write-Host "Downloading vc_redist.x64.exe..."
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
          Write-Host "Downloaded: $((Get-Item $dest).Length) bytes"

      - name: Create output directory
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path dist\installer | Out-Null

      - name: Build Inno Setup installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
              /DAppVersion="${{ env.APP_VERSION }}" `
              "installer\windows\setup.iss"

      # ── 8. Sign the installer (optional) ─────────────────────────────────
      - name: Sign installer (optional)
        if: env.HAS_WIN_CERT == 'true'
        shell: powershell
        run: |
          $cert_bytes = [Convert]::FromBase64String("${{ secrets.WIN_CERT_BASE64 }}")
          $cert_path  = "$env:TEMP\orvion_cert.pfx"
          [IO.File]::WriteAllBytes($cert_path, $cert_bytes)
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
              /f  $cert_path `
              /p  "${{ secrets.WIN_CERT_PWD }}" `
              /tr "http://timestamp.digicert.com" `
              /td sha256 /fd sha256 `
              "dist\installer\OrvionSetup-windows-x64.exe"
          Remove-Item $cert_path -Force

      # ── 9. Upload artifact ────────────────────────────────────────────────
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OrvionSetup-windows-x64
          path: dist/installer/OrvionSetup-windows-x64.exe
          retention-days: 30
          if-no-files-found: error


# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  LINUX BUILD                                                             ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
  build-linux:
    name: "Linux — AppImage"
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      # ── 1. Source ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CA certificates
        run: sudo apt-get install -y ca-certificates
        
      # ── 2. System packages needed by PyQtWebEngine + AppImage tools ────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libfreetype6 \
            libx11-6 \
            libxcb1 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxext6 \
            libxrender1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libnspr4 \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libasound2 \
            libpango-1.0-0 \
            libcairo2 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxtst6 \
            binutils \
            fuse \
            file \
            patchelf \
            upx-ucl

      # ── 3. Python ───────────────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ── 4. Dependencies (API-only — no torch / transformers) ───────────────
      - name: Upgrade pip / wheel / setuptools
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Install runtime dependencies
        run: |
          pip install \
            "PyQt5>=5.15.10" \
            "PyQtWebEngine>=5.15.7" \
            "Pillow>=10.0.0" \
            "psutil>=5.9.0" \
            "requests>=2.31.0" \
            "gradio_client>=0.7.0" \
            "packaging>=23.0" \
            "python-dotenv>=1.0.0"

      - name: Install PyInstaller
        run: pip install "pyinstaller>=6.0.0"

      # ── 5. Generate placeholder icon if missing ────────────────────────────
      - name: Generate placeholder icon
        run: |
          mkdir -p installer/linux
          if [ ! -f installer/linux/orvion.png ]; then
            python3 -c "
          from PIL import Image
          img = Image.new('RGBA', (256, 256), (108, 78, 230, 255))
          img.save('installer/linux/orvion.png')
          print('Generated placeholder icon')
          " || echo "Warning: could not generate icon"
          fi

      # ── 6. Write .env so the frozen app can read HF_TOKEN via load_dotenv() ─
      - name: Inject HF_TOKEN into .env
        run: |
          TOKEN="${{ secrets.HF_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::HF_TOKEN secret is not set — Space calls may fail at runtime"
          fi
          echo "HF_TOKEN=${TOKEN}" > .env
          echo "Wrote .env (token length: ${#TOKEN})"

      # ── 7. PyInstaller build ──────────────────────────────────────────────
      - name: Build with PyInstaller
        run: pyinstaller orvion.spec --clean --noconfirm
        env:
          ORVION_VERSION: ${{ env.APP_VERSION }}

      # ── 8. Build AppImage ─────────────────────────────────────────────────
      - name: Make scripts executable
        run: chmod +x installer/linux/build_appimage.sh installer/linux/AppRun

      - name: Build AppImage
        run: bash installer/linux/build_appimage.sh
        env:
          ORVION_VERSION: ${{ env.APP_VERSION }}

      # ── 8. Upload artifact ────────────────────────────────────────────────
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Orvion-linux-x86_64
          path: dist/installer/Orvion-linux-x86_64.AppImage
          retention-days: 30
          if-no-files-found: error


# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  macOS BUILD                                                             ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
  build-macos:
    name: "macOS — DMG"
    runs-on: macos-14
    timeout-minutes: 45

    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_IDENTITY != '' }}

    steps:
      # ── 1. Source ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ───────────────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ── 3. Homebrew tools ────────────────────────────────────────────────────
      - name: Install Homebrew tools
        run: brew install create-dmg upx || true

      # ── 4. Dependencies (API-only — no torch / transformers) ───────────────
      - name: Upgrade pip / wheel / setuptools
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Install runtime dependencies
        run: |
          pip install \
            "PyQt5>=5.15.10" \
            "PyQtWebEngine>=5.15.7" \
            "Pillow>=10.0.0" \
            "psutil>=5.9.0" \
            "requests>=2.31.0" \
            "gradio_client>=0.7.0" \
            "packaging>=23.0" \
            "python-dotenv>=1.0.0"

      - name: Install PyInstaller
        run: pip install "pyinstaller>=6.0.0"

      # ── 5. Generate icon and build ────────────────────────────────────────
      - name: Generate placeholder icon
        run: |
          mkdir -p installer/macos
          if [ ! -f installer/macos/orvion.icns ]; then
            python3 -c "
          import subprocess, pathlib
          from PIL import Image
          img = Image.new('RGBA', (1024, 1024), (108, 78, 230, 255))
          iconset = pathlib.Path('installer/macos/orvion.iconset')
          iconset.mkdir(exist_ok=True)
          for size in [16, 32, 64, 128, 256, 512, 1024]:
              img.resize((size, size), Image.LANCZOS).save(iconset / f'icon_{size}x{size}.png')
              if size <= 512:
                  img.resize((size*2, size*2), Image.LANCZOS).save(iconset / f'icon_{size}x{size}@2x.png')
          r = subprocess.run(['iconutil', '-c', 'icns', str(iconset),
                              '-o', 'installer/macos/orvion.icns'], capture_output=True)
          print('iconutil:', r.returncode, r.stderr.decode())
          " || echo "Warning: could not generate .icns"
          fi

      # ── 5. Write .env so the frozen app can read HF_TOKEN via load_dotenv() ─
      - name: Inject HF_TOKEN into .env
        run: |
          TOKEN="${{ secrets.HF_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::HF_TOKEN secret is not set — Space calls may fail at runtime"
          fi
          echo "HF_TOKEN=${TOKEN}" > .env
          echo "Wrote .env (token length: ${#TOKEN})"

      - name: Build with PyInstaller
        run: pyinstaller orvion.spec --clean --noconfirm
        env:
          ORVION_VERSION: ${{ env.APP_VERSION }}

      # ── 6. Ad-hoc sign (lets the app open without Gatekeeper prompt) ───────
      - name: Ad-hoc code sign
        run: |
          codesign --force --deep --sign - \
            --entitlements installer/macos/entitlements.plist \
            dist/Orvion.app || true

      # ── 7. Developer ID sign (only when APPLE_IDENTITY secret is set) ──────
      - name: Developer ID code sign (optional)
        if: env.HAS_APPLE_CERT == 'true'
        run: |
          codesign \
            --deep --force --verify --verbose \
            --timestamp \
            --options runtime \
            --entitlements installer/macos/entitlements.plist \
            --sign "${{ secrets.APPLE_IDENTITY }}" \
            dist/Orvion.app

      # ── 8. Build DMG ──────────────────────────────────────────────────────
      - name: Make DMG build script executable
        run: chmod +x installer/macos/build_dmg.sh

      - name: Build DMG
        run: bash installer/macos/build_dmg.sh
        env:
          ORVION_VERSION: ${{ env.APP_VERSION }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_TEAM_ID:  ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID:       ${{ secrets.APPLE_ID }}
          APPLE_APP_PWD:  ${{ secrets.APPLE_APP_PWD }}

      # ── 9. Upload artifact ────────────────────────────────────────────────
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Orvion-macos-universal
          path: dist/installer/Orvion-macos-universal.dmg
          retention-days: 30
          if-no-files-found: error


# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  GITHUB RELEASE  (only on version tag push or manual trigger)            ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
  release:
    name: "Create GitHub Release"
    needs: [ build-windows, build-linux, build-macos ]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: OrvionSetup-windows-x64
          path: release-assets/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Orvion-linux-x86_64
          path: release-assets/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Orvion-macos-universal
          path: release-assets/

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ env.APP_VERSION }}-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.version.outputs.tag }}
          name:       "Orvion ${{ steps.version.outputs.tag }}"
          draft:      false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            ## Orvion ${{ steps.version.outputs.tag }}

            ### Download
            | Platform | File | Notes |
            |----------|------|-------|
            | Windows 10/11 | `OrvionSetup-windows-x64.exe` | Run the installer, then launch Orvion |
            | Linux x86_64 | `Orvion-linux-x86_64.AppImage` | `chmod +x` then run |
            | macOS 12+ | `Orvion-macos-universal.dmg` | Open DMG, drag to Applications |

            ### About this build
            Orvion runs in **API mode** — all AI inference is handled remotely via
            a HuggingFace Space. No local GPU, no PyTorch, no model download required.
            The installer is lightweight (~150 MB) and launches instantly.

            ### SHA-256 Checksums
            See `SHA256SUMS.txt` attached below.

          files: |
            release-assets/OrvionSetup-windows-x64.exe
            release-assets/Orvion-linux-x86_64.AppImage
            release-assets/Orvion-macos-universal.dmg
            release-assets/SHA256SUMS.txt
